<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 292" width="680" height="292" role="img">
  <title>NextPaste 一次剪贴板同步的完整流程</title>
  <desc>先经历握手阶段建立连接并嗅探协议版本，再进入同步阶段：捕获剪贴板变化、NPBP 编码分片、WebSocket 广播、对端重组写入剪贴板</desc>
  <style>
    text { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .th { font-weight: 500; }
    .ts { font-weight: 400; fill: #5F5E5A; }
  </style>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="292" fill="#FFFFFF"/>
  <text class="ts" x="40" y="42" text-anchor="start" dominant-baseline="central" font-size="12" fill="#185FA5">① 握手阶段（连接建立，每次连接触发一次）</text>
  <g>
    <rect x="40" y="56" width="132" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text class="th" x="106" y="76" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#0C447C">建立 WS 连接</text>
    <text class="ts" x="106" y="94" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">手机输入 ws:// 地址</text>
  </g>
  <g>
    <rect x="196" y="56" width="132" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text class="th" x="262" y="76" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#0C447C">发送握手帧</text>
    <text class="ts" x="262" y="94" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">设备名 · OS · 版本</text>
  </g>
  <g>
    <rect x="352" y="56" width="132" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text class="th" x="418" y="76" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#0C447C">协议嗅探</text>
    <text class="ts" x="418" y="94" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">Text→V1.0 / Binary→V1.1</text>
  </g>
  <g>
    <rect x="508" y="56" width="132" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text class="th" x="574" y="76" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#0C447C">标记会话模式</text>
    <text class="ts" x="574" y="94" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">进入消息循环</text>
  </g>
  <line x1="172" y1="84" x2="196" y2="84" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="328" y1="84" x2="352" y2="84" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="484" y1="84" x2="508" y2="84" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <path d="M574 112 V152 H106 V186" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow2)"/>
  <text class="ts" x="40" y="174" text-anchor="start" dominant-baseline="central" font-size="12" fill="#0F6E56">② 同步阶段（连接存续期间持续循环）</text>
  <g>
    <rect x="40" y="186" width="132" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text class="th" x="106" y="206" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#085041">捕获剪贴板变化</text>
    <text class="ts" x="106" y="224" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">文本 · 图片 · 文件</text>
  </g>
  <g>
    <rect x="196" y="186" width="132" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text class="th" x="262" y="206" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#085041">NPBP 编码分片</text>
    <text class="ts" x="262" y="224" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">33B 包头 + MF 标志</text>
  </g>
  <g>
    <rect x="352" y="186" width="132" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text class="th" x="418" y="206" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#085041">WebSocket 广播</text>
    <text class="ts" x="418" y="224" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">发往全部客户端</text>
  </g>
  <g>
    <rect x="508" y="186" width="132" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text class="th" x="574" y="206" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#085041">重组写入剪贴板</text>
    <text class="ts" x="574" y="224" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">对端粘贴即用</text>
  </g>
  <line x1="172" y1="214" x2="196" y2="214" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="328" y1="214" x2="352" y2="214" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="484" y1="214" x2="508" y2="214" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text class="ts" x="340" y="270" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">全程心跳保活；路径对称：手机复制 → PC 写入剪贴板，反向同理</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" width="680" height="310" role="img">
  <title>NextPaste 整体架构与连接拓扑</title>
  <desc>PC 桌面端与 HarmonyOS 客户端可通过局域网 WebSocket 直连，或经公网中继服务器按 roomID 转发</desc>
  <style>
    text { font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .th { font-weight: 500; }
    .ts { font-weight: 400; fill: #5F5E5A; }
  </style>
  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="680" height="310" fill="#FFFFFF"/>
  <g>
    <rect x="50" y="70" width="190" height="64" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text class="th" x="145" y="94" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#0C447C">PC 桌面端</text>
    <text class="ts" x="145" y="114" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">Wails · Go + Vue3</text>
  </g>
  <g>
    <rect x="440" y="70" width="190" height="64" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text class="th" x="535" y="94" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#0C447C">HarmonyOS 客户端</text>
    <text class="ts" x="535" y="114" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">ArkTS · 息屏可接收</text>
  </g>
  <line x1="240" y1="102" x2="440" y2="102" stroke="#185FA5" stroke-width="1.5" marker-start="url(#arrow1)" marker-end="url(#arrow1)"/>
  <text class="ts" x="340" y="86" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">局域网 WebSocket 直连</text>
  <g>
    <rect x="245" y="210" width="190" height="64" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text class="th" x="340" y="234" text-anchor="middle" dominant-baseline="central" font-size="14" fill="#633806">中继服务器</text>
    <text class="ts" x="340" y="254" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">纯 Go · roomID 房间隔离</text>
  </g>
  <path d="M145 134 V242 H245" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow1)"/>
  <text class="ts" x="138" y="182" text-anchor="end" dominant-baseline="central" font-size="12" fill="#854F0B">客户端模式</text>
  <text class="ts" x="138" y="200" text-anchor="end" dominant-baseline="central" font-size="12" fill="#854F0B">经公网中继</text>
  <path d="M435 242 H535 V134" fill="none" stroke="#854F0B" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow1)"/>
  <text class="ts" x="542" y="182" text-anchor="start" dominant-baseline="central" font-size="12" fill="#854F0B">同 roomID</text>
  <text class="ts" x="542" y="200" text-anchor="start" dominant-baseline="central" font-size="12" fill="#854F0B">纯转发不留存</text>
</svg>
